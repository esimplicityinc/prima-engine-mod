# Central Management Server Configuration
# 
# This server:
# - Has full database access
# - Manages API keys, teams, budgets
# - Serves the Admin UI
# - Exposes internal APIs for remote proxies to authenticate and report spend

model_list:
  # Add your models here, or manage them via the Admin UI
  # Remote proxies will fetch this configuration
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Database configuration
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  
  # Internal API endpoints for remote proxies
  # Remote proxies authenticate with this service key
  internal_service_keys:
    - key: os.environ/LITELLM_INTERNAL_SERVICE_KEY
      name: "Remote Proxy Service Key"
      allowed_endpoints: ["internal/*"]
  
  # Cache settings for auth validation responses
  # This TTL tells remote proxies how long to cache auth results
  remote_proxy_auth_cache_ttl_seconds: 300
  
  # Enable background health checks
  background_health_checks: true
  health_check_interval: 300
  
  # Rate limiting
  max_parallel_requests: 100

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 60
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  drop_params: true
  request_timeout: 60
  # Enable caching with Redis
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

# Remote Proxy Configuration
#
# This config is for remote (thin) proxies that connect to a central management server.
# Remote proxies:
# - Do NOT require database access
# - Authenticate API keys via the central server
# - Report spend to the central server
# - Fetch model configuration from the central server
# - Cache authentication results locally for performance
#
# Set up your LLM API keys here - remote proxies make their own LLM API calls.

model_list:
  # Remote proxies need their own LLM API keys
  # Model routing configuration is fetched from the central server
  # but API keys are local to each proxy
  - model_name: gpt-4
    litellm_params:
      model: azure/gpt-4
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  # Master key is still required for local admin access (optional)
  # master_key: os.environ/LITELLM_MASTER_KEY
  
  # Remote proxy configuration
  remote_proxy:
    enabled: true
    
    # Central management server URL
    central_server_url: os.environ/CENTRAL_SERVER_URL
    # Example: https://central.example.com
    
    # Service key for authenticating with central server
    service_key: os.environ/CENTRAL_SERVICE_KEY
    
    # Caching settings
    # How long to cache successful auth results (seconds)
    auth_cache_ttl_seconds: 300  # 5 minutes
    
    # How often to poll central server for config changes (seconds)
    config_poll_interval_seconds: 60
    
    # Fallback behavior when central server is unreachable
    allow_cached_auth_on_central_failure: true
    max_cache_age_on_failure_seconds: 3600  # 1 hour
    
    # Disable management routes on remote proxy (recommended)
    # Users should manage keys/teams via the central server
    disable_management_routes: true
    
    # Disable admin UI on remote proxy (recommended)
    # Admin UI is available on the central server
    disable_ui: true
    
    # Spend reporting settings
    spend_report_batch_size: 100
    spend_report_interval_seconds: 10

router_settings:
  # Router settings can be local or fetched from central
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 60

# Central Management Server Configuration
# 
# This config is for the central management server that remote proxies connect to.
# The central server has:
# - Full database access (PostgreSQL)
# - Admin UI enabled
# - Internal API endpoints for remote proxies
# - All management routes enabled
#
# Remote proxies authenticate with this server using internal service keys.

model_list:
  - model_name: gpt-4
    litellm_params:
      model: azure/gpt-4
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Database configuration (required for central server)
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  
  # Enable internal API endpoints for remote proxies
  # Remote proxies authenticate with these service keys
  internal_service_keys:
    - key: os.environ/INTERNAL_SERVICE_KEY_EAST
      name: "East Region Proxy"
      allowed_endpoints: ["internal/*"]
    - key: os.environ/INTERNAL_SERVICE_KEY_WEST
      name: "West Region Proxy"
      allowed_endpoints: ["internal/*"]
  
  # Cache settings - recommended for performance
  # Remote proxies will cache auth results locally, but central
  # should also cache for faster responses
  
  # Settings that remote proxies will inherit
  max_parallel_requests: 100
  alerting_threshold: 300

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 60
